<script>
  /* Apply the saved theme and text direction before first paint (main.js applies everything again). */
  (function () { try {
    var s = JSON.parse(localStorage.getItem('rs-settings') || '{}'), d = document.documentElement;
    if (s.theme === 'light' || s.theme === 'dark') d.setAttribute('data-theme', s.theme);
    if (typeof s.lang === 'string' && /^[a-z]{2}$/.test(s.lang)) { d.lang = s.lang; d.dir = (s.lang === 'ar' || s.lang === 'ur') ? 'rtl' : 'ltr'; }
  } catch (e) {} })();
</script>
