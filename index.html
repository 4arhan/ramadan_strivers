<script>
  /* Demo mode (?demo=1: the live demo on the product page). The app then runs on a sample month and must never read
     or write the visitor's own data. So before anything else runs, the browser's storage is replaced by a copy kept
     in memory (carried through a reload in one key of this tab's session storage, gone when the tab closes) and
     statistics are switched off. Where the browser will not let the storage objects be replaced, their methods are
     redirected instead and a probe checks that a write no longer arrives. If neither works, nothing else on this page
     runs.
     js/demo.js supplies the sample month and answers the app's server calls. */
  (function () {
    if (!/[?&]demo=1(&|$)/.test(location.search)) return;
    var KEY = 'rs-demo', real = null, realLocal = null, st = null, ok = false, again = /[?&]fresh=1(&|$)/.test(location.search), kids = /[?&]kids=1(&|$)/.test(location.search);
    try { realLocal = window.localStorage; } catch (e) { realLocal = null; }
    try { real = window.sessionStorage; st = again ? null : JSON.parse(real.getItem(KEY) || 'null'); } catch (e) { st = null; }
    var put = function (k, v) { real.setItem(k, v); };                 // how the demo's own state reaches the real session storage
    // ?fresh=1 starts the sample month again and ?kids=1 opens it in kids mode. Both are taken out of the address,
    // so a reload keeps what happened since.
    if (again || kids) { try { history.replaceState(history.state, '', location.pathname + '?demo=1' + location.hash); } catch (e) { /* the address stays */ } }
    if (!st || st.v !== 1 || !st.l || !st.s || typeof st.l !== 'object' || typeof st.s !== 'object') st = { v: 1, l: {}, s: {} };
    function keep() { try { if (real) put(KEY, JSON.stringify(st)); } catch (e) { /* memory only */ } }
    function has(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }
    function store(o) {
      return {
        getItem: function (k) { k = String(k); return has(o, k) ? o[k] : null; },
        setItem: function (k, v) { o[String(k)] = String(v); keep(); },
        removeItem: function (k) { delete o[String(k)]; keep(); },
        clear: function () { Object.keys(o).forEach(function (k) { delete o[k]; }); keep(); },
        key: function (i) { var ks = Object.keys(o); return i >= 0 && i < ks.length ? ks[i] : null; },
        get length() { return Object.keys(o).length; }
      };
    }
    var ls = store(st.l), ss = store(st.s);
    try {
      Object.defineProperty(window, 'localStorage', { configurable: true, get: function () { return ls; } });
      Object.defineProperty(window, 'sessionStorage', { configurable: true, get: function () { return ss; } });
      ok = window.localStorage === ls && window.sessionStorage === ss;
    } catch (e) { ok = false; }
    if (!ok) ok = (function () {
      try {
        var P = window.Storage.prototype, get = P.getItem, set = P.setItem, del = P.removeItem, clr = P.clear, key = P.key, len = Object.getOwnPropertyDescriptor(P, 'length');
        var mine = function (x) { return x === ls || x === ss ? x : (realLocal && x === realLocal ? ls : (real && x === real ? ss : null)); };
        put = function (k, v) { set.call(real, k, v); };
        P.getItem = function (k) { var m = mine(this); return m ? m.getItem(k) : get.apply(this, arguments); };
        P.setItem = function (k, v) { var m = mine(this); return m ? m.setItem(k, v) : set.apply(this, arguments); };
        P.removeItem = function (k) { var m = mine(this); return m ? m.removeItem(k) : del.apply(this, arguments); };
        P.clear = function () { var m = mine(this); return m ? m.clear() : clr.apply(this, arguments); };
        P.key = function (i) { var m = mine(this); return m ? m.key(i) : key.apply(this, arguments); };
        Object.defineProperty(P, 'length', { configurable: true, enumerable: true, get: function () { var m = mine(this); return m ? m.length : len.get.call(this); } });
        // the proof: something written the way the app writes it must not arrive in the real storage, either kind
        var probe = 'rs-demo-probe', leaked = false;
        window.localStorage.setItem(probe, '1'); window.sessionStorage.setItem(probe, '1');
        if (realLocal && get.call(realLocal, probe) !== null) { leaked = true; del.call(realLocal, probe); }
        if (real && get.call(real, probe) !== null) { leaked = true; del.call(real, probe); }
        var seen = window.localStorage.getItem(probe) === '1' && window.sessionStorage.getItem(probe) === '1' && has(st.l, probe) && has(st.s, probe);
        window.localStorage.removeItem(probe); window.sessionStorage.removeItem(probe);
        return seen && !leaked;
      } catch (e) { return false; }
    })();
    if (!ok) { document.write('<plaintext style="display:none">'); location.replace('/product'); return; }   // the rest of the page is never run
    window['ga-disable-G-Y3WDNYW5P2'] = true;
    window.RS_DEMO = { fresh: !has(st.l, 'rs-settings'), kids: kids };
    if (window.RS_DEMO.fresh) {
      ls.setItem('rs-setup', '1'); ls.setItem('rs-consent', 'no'); ls.setItem('rs-inst-x', '1');
      ls.setItem('rs-settings', JSON.stringify({ mode: 'ramadan', day: 12, theme: 'light', themeChosen: true, detail: true }));
    }
    document.write('<script src="data/cities.js"><\/script>');   // so the demo can show prayer times for the visitor's time zone at once
  })();
</script>

<script>
  /* Family profiles: a switch asked for by js/social.js (sessionStorage rsf-switch) happens here, before any module
     reads storage. The profile in use lives in the rs-* keys; the others wait in rsf-data-<id>. The outgoing profile
     is stored first, so a full device loses nothing: the write fails and the switch is skipped. */
  (function () { try {
    var ss = window.sessionStorage, ls = window.localStorage, req = ss.getItem('rsf-switch');
    if (!req) return;
    ss.removeItem('rsf-switch'); req = JSON.parse(req);
    var f = JSON.parse(ls.getItem('rsf-profiles') || 'null');
    if (!f || !f.list || req.to === f.active || !f.list.some(function (p) { return p.id === req.to; })) return;
    var DEVICE = { 'rs-dev-sw': 1, 'rs-inst-x': 1, 'rs-push': 1 }, keys = [], out = {}, i, k;
    for (i = 0; i < ls.length; i++) { k = ls.key(i); if (k && k.indexOf('rs-') === 0 && !DEVICE[k]) keys.push(k); }
    keys.forEach(function (x) { out[x] = ls.getItem(x); });
    ls.setItem('rsf-data-' + f.active, JSON.stringify(out));
    keys.forEach(function (x) { ls.removeItem(x); });
    var inc = JSON.parse(ls.getItem('rsf-data-' + req.to) || 'null');
    if (inc) { for (k in inc) if (Object.prototype.hasOwnProperty.call(inc, k) && typeof inc[k] === 'string') ls.setItem(k, inc[k]); ls.removeItem('rsf-data-' + req.to); }
    else if (req.settings) ls.setItem('rs-settings', JSON.stringify(req.settings));
    f.active = req.to; ls.setItem('rsf-profiles', JSON.stringify(f));
  } catch (e) {} })();
</script>
<script>
  /* Apply the saved theme and text direction before first paint (main.js applies everything again). */
  (function () { try {
    var s = JSON.parse(localStorage.getItem('rs-settings') || '{}'), d = document.documentElement;
    d.setAttribute('data-theme', s.theme === 'dark' ? 'dark' : 'light');
    if (s.theme === 'system' && s.themeChosen) d.removeAttribute('data-theme');   /* light unless dark, or System, was chosen */
    if (typeof s.lang === 'string' && /^[a-z]{2}$/.test(s.lang)) { d.lang = s.lang; d.dir = (s.lang === 'ar' || s.lang === 'ur' || s.lang === 'fa') ? 'rtl' : 'ltr'; }
  } catch (e) {} })();
</script>
